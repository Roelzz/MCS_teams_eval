[project]
name = "teams-eval"
version = "0.1.0"
description = "Copilot Studio channel-parity eval tool — prove Teams and Direct give the same answers, built on Inspect AI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "inspect-ai>=0.3.0",
    "microsoft-agents-copilotstudio-client>=0.7.0",
    "msal>=1.31.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "loguru>=0.7.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "typer>=0.12.0",
    "openai>=1.0.0",
    "reflex>=0.9.5.post2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
